# Streamlit settings for local runs and Streamlit Community Cloud.
# No secrets here: the Gemini key goes in .env locally or in the host's secrets settings.

[theme]
base = "light"
primaryColor = "#B3263A"      # lingonberry red, from assets/logo.svg
backgroundColor = "#F7F5F3"   # warm off-white page (design/Lingonberry Redesign v2.dc.html)
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F1B1A"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
